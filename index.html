<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>West Yorkshire Bin Cleaning</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#f5f7fa;color:#333;line-height:1.6;}

header{
  background:#1e3a8a;
  color:#fff;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

header h1{font-size:20px;}
nav a{
  color:#fff;
  text-decoration:none;
  margin:0 10px;
  font-weight:bold;
}
nav a:hover{opacity:0.8;}

.hero{
  background:#2563eb;
  color:#fff;
  text-align:center;
  padding:60px 20px;
}

.hero h2{font-size:28px;margin-bottom:15px;}

section{
  max-width:900px;
  margin:40px auto;
  padding:30px;
  background:#fff;
  border-radius:8px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

section h3{margin-bottom:15px;color:#1e3a8a;}

form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

input,select,textarea,button{
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:14px;
}

button{
  background:#1e3a8a;
  color:#fff;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

button:hover{background:#2563eb;}

.phone-area{
  text-align:center;
  margin-top:20px;
}

.phone-number{
  display:none;
  font-weight:bold;
  margin-left:10px;
}

footer{
  background:#1e3a8a;
  color:#fff;
  text-align:center;
  padding:20px;
  margin-top:40px;
}

@media(max-width:768px){
  nav{margin-top:10px;}
  .hero h2{font-size:22px;}
}
</style>
</head>
<body>

<header>
  <h1>West Yorkshire Bin Cleaning</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="commercial-bin-cleaning-bradford.html">Bradford</a>
    <a href="commercial-bin-cleaning-leeds.html">Leeds</a>
    <a href="commercial-bin-cleaning-wakefield.html">Wakefield</a>
    <a href="residential-bin-cleaning-west-yorkshire.html">Domestic</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="hero">
  <h2>Professional Bin Cleaning Services</h2>
  <p>Commercial & Residential Bin Cleaning Across West Yorkshire</p>
</div>

<section>
  <h3>Get a Free Quote</h3>

  <form onsubmit="submitEnquiry(event)">

    <select name="enquiryType" required>
      <option value="">Select Enquiry Type</option>
      <option value="Residential">Residential</option>
      <option value="Commercial">Commercial</option>
    </select>

    <input type="text" name="fullName" placeholder="Full Name" required>
    <input type="text" name="companyName" placeholder="Company Name">

    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="phone" placeholder="Phone Number" required>
    <input type="text" name="postcode" placeholder="Postcode" required>

    <input type="number" name="numberOfBins" placeholder="Number of Bins" required>

    <select name="serviceFrequency" required>
      <option value="">Service Frequency</option>
      <option value="Weekly">Weekly</option>
      <option value="Fortnightly">Fortnightly</option>
      <option value="Monthly">Monthly</option>
    </select>

    <textarea name="additionalDetails" placeholder="Additional Details"></textarea>

    <button type="submit">Submit Enquiry</button>

  </form>

  <div class="phone-area">
    <button onclick="showPhone()">Show Phone Number</button>
    <span class="phone-number" id="phoneNumber">01234 567890</span>
  </div>

</section>

<footer>
  © 2026 West Yorkshire Bin Cleaning | All Rights Reserved
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADxEq-T2PW4Nk8ERbXjcq6oJzdDHu8F6E",
  authDomain: "westyorkshirebincleaning.firebaseapp.com",
  projectId: "westyorkshirebincleaning",
  storageBucket: "westyorkshirebincleaning.firebasestorage.app",
  messagingSenderId: "236905379736",
  appId: "1:236905379736:web:d179462e7d3b670be05ded",
  measurementId: "G-905799P3VY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.submitEnquiry = async function(event){
  event.preventDefault();

  const form = event.target;

  const data = {
    enquiryType: form.enquiryType.value,
    fullName: form.fullName.value,
    companyName: form.companyName.value,
    email: form.email.value,
    phone: form.phone.value,
    postcode: form.postcode.value,
    numberOfBins: form.numberOfBins.value,
    serviceFrequency: form.serviceFrequency.value,
    additionalDetails: form.additionalDetails.value,
    createdAt: new Date()
  };

  try{
    await addDoc(collection(db,"enquiries"),data);
    alert("Enquiry submitted successfully!");
    form.reset();
  }catch(error){
    alert("Error submitting form.");
    console.error(error);
  }
}

window.showPhone = function(){
  document.getElementById("phoneNumber").style.display = "inline";
}

</script>

</body>
</html>
