<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Commercial Site Assessment | Bradford Bin Cleaning</title>
  <meta name="description" content="Request a commercial bin cleaning site assessment across Bradford, Leeds and Wakefield. Structured contracts for restaurants, hotels and commercial estates.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
      line-height: 1.6;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    /* HEADER */
    .site-header {
      background: #111;
      padding: 18px 0;
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      height: 50px;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 30px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .nav a:hover {
      opacity: 0.7;
    }

    /* HERO */
    .page-hero {
      background: linear-gradient(
          to right,
          rgba(15,15,15,0.85),
          rgba(15,15,15,0.65)
        ),
        url("bin-after.jpg") center/cover no-repeat;

      color: #fff;
      padding: 120px 0;
      text-align: center;
    }

    .page-hero h1 {
      font-size: 44px;
      margin-bottom: 15px;
    }

    .page-hero p {
      font-size: 20px;
      opacity: 0.95;
    }

    /* FORM SECTION */
    .section {
      padding: 90px 0;
      background: #fff;
    }

    form {
      background: #fff;
      padding: 50px;
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 25px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 15px;
    }

    input:focus, textarea:focus {
      border-color: #e10600;
      outline: none;
    }

    .btn {
      display: inline-block;
      padding: 15px 32px;
      background: #e10600;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #b80000;
    }

    /* CONTACT INFO */
    .contact-info {
      margin-top: 60px;
      text-align: center;
    }

    .contact-info h3 {
      margin-bottom: 10px;
    }

    /* FOOTER */
    .footer {
      background: #0d0d0d;
      color: #aaa;
      padding: 50px 20px;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      form {
        padding: 30px;
      }

      .page-hero h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container header-flex">
    <img src="logo.png" alt="Bradford Bin Cleaning" class="logo">
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>Request a Commercial Site Assessment</h1>
    <p>Structured waste sanitisation contracts across West Yorkshire</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <form action="https://formsubmit.co/bradfordbincleaning@gmail.com" method="POST">
      
      <label>Business Name</label>
      <input type="text" name="business_name" required>

      <label>Contact Name</label>
      <input type="text" name="contact_name" required>

      <label>Email Address</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="tel" name="phone">

      <label>Site Address</label>
      <input type="text" name="address">

      <label>Brief Description of Requirements</label>
      <textarea name="message" rows="5"></textarea>

      <button type="submit" class="btn">Submit Assessment Request</button>
    </form>

    <div class="contact-info">
      <h3>Direct Contact</h3>
      <p>07840 507481</p>
      <p>bradfordbincleaning@gmail.com</p>
    </div>
  </div>
</section>

<footer class="footer">
  <p>© 2026 Bradford Bin Cleaning | Regional Commercial Contractor</p>
  <p>Bradford • Leeds • Wakefield</p>
</footer>

</body>
</html>
