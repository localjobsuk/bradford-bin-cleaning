<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Commercial Quote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="section dark">
  <div class="form-container">

    <h1>Request Commercial Site Assessment</h1>

    <form class="professional-form">

      <input type="text" placeholder="Business Name" required>

      <input type="text" placeholder="Contact Person" required>

      <input type="email" placeholder="Email Address" required>

      <input type="tel" placeholder="Phone Number" required>

      <select required>
        <option value="">Select Business Type</option>
        <option>Hotel</option>
        <option>Restaurant</option>
        <option>Property Management</option>
        <option>Commercial Estate</option>
      </select>

      <textarea placeholder="Tell us about your site requirements..." rows="5"></textarea>

      <button type="submit" class="btn large-btn">Submit Request</button>

    </form>

  </div>
</section>

</body>
</html>
