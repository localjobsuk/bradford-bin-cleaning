<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book a Bin Clean</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-flex">
    <img src="img/logo.png" class="logo" alt="Bradford Bin Cleaning">
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="booking.html" class="active">Book Now</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <h2>Book Your Bin Clean</h2>

    <form class="form">
      <label>Service Type</label>
      <select id="service">
        <option value="one">One-Off (£9 per bin)</option>
        <option value="monthly">Monthly</option>
      </select>

      <label>Number of Bins</label>
      <select id="bins">
        <option value="1">1 Bin</option>
        <option value="2">2 Bins</option>
        <option value="3">3 Bins</option>
      </select>

      <div class="price-box">
        Total: £<span id="price">9</span>
      </div>

      <label>Name</label>
      <input type="text" required>

      <label>Phone</label>
      <input type="tel" required>

      <label>Address</label>
      <textarea required></textarea>

      <button class="btn">Request Booking</button>
    </form>
  </div>
</section>

<footer class="footer">
  <p>📞 07840 507481 | ✉ bradfordbincleaning@gmail.com</p>
</footer>

<script>
const service = document.getElementById('service');
const bins = document.getElementById('bins');
const price = document.getElementById('price');

function updatePrice() {
  const b = Number(bins.value);
  if (service.value === 'one') {
    price.textContent = b * 9;
  } else {
    price.textContent = b === 1 ? 5 : b === 2 ? 8 : 10;
  }
}
service.onchange = updatePrice;
bins.onchange = updatePrice;
updatePrice();
</script>

</body>
</html>
