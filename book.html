<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Commercial Quote | Bradford Bin Cleaning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-flex">
    <div class="logo-container">
      <img src="logo.png" alt="Bradford Bin Cleaning" class="logo">
    </div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="book.html" class="active">Request Quote</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="section dark">
  <div class="container">

    <div class="form-wrapper">
      <h1>Request Commercial Site Assessment</h1>

      <form class="professional-form">

        <input type="text" placeholder="Business Name" required>

        <input type="text" placeholder="Contact Person" required>

        <input type="email" placeholder="Email Address" required>

        <input type="tel" placeholder="Phone Number" required>

        <input type="text" placeholder="Site Address / Location" required>

        <select required>
          <option value="">Select Business Type</option>
          <option>Hotel</option>
          <option>Restaurant</option>
          <option>Property Management</option>
          <option>Commercial Estate</option>
        </select>

        <input type="number" placeholder="Estimated Number of Bins">

        <textarea placeholder="Additional details about your site requirements..."></textarea>

        <button type="submit">Submit Request</button>

      </form>
    </div>

  </div>
</section>

<footer class="footer">
  <p>© 2026 Bradford Bin Cleaning | Regional Contractor</p>
</footer>

</body>
</html>
