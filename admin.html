<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard - West Yorkshire Waste Sanitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; padding:20px; background:#f5f5f5;}
    table { width:100%; border-collapse: collapse; background:white;}
    th, td { padding:10px; border:1px solid #ddd; }
    th { background:#222; color:white;}
    select, textarea { width:100%; }
    button { padding:5px 10px; }
  </style>
</head>
<body>

<h2>Enquiries Dashboard</h2>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Postcode</th>
      <th>Type</th>
      <th>Bins</th>
      <th>Status</th>
      <th>Notes</th>
      <th>Save</th>
    </tr>
  </thead>
  <tbody id="enquiryTable"></tbody>
</table>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyADxEq-T2PW4Nk8ERbXjcq6oJzdDHu8F6E",
    authDomain: "westyorkshirebincleaning.firebaseapp.com",
    projectId: "westyorkshirebincleaning",
    storageBucket: "westyorkshirebincleaning.appspot.com",
    messagingSenderId: "236905379736",
    appId: "1:236905379736:web:d179462e7d3b670be05ded"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const table = document.getElementById("enquiryTable");

  db.collection("enquiries").orderBy("submittedAt", "desc")
    .onSnapshot(snapshot => {
      table.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();

        const row = `
          <tr>
            <td>${data.submittedAt?.toDate().toLocaleString() || ''}</td>
            <td>${data.fullName || ''}</td>
            <td>${data.email || ''}</td>
            <td>${data.phone || ''}</td>
            <td>${data.postcode || ''}</td>
            <td>${data.enquiryType || ''}</td>
            <td>${data.numBins || ''}</td>
            <td>
              <select id="status-${doc.id}">
                <option ${data.status=="New"?"selected":""}>New</option>
                <option ${data.status=="Contacted"?"selected":""}>Contacted</option>
                <option ${data.status=="Quoted"?"selected":""}>Quoted</option>
                <option ${data.status=="Won"?"selected":""}>Won</option>
                <option ${data.status=="Lost"?"selected":""}>Lost</option>
              </select>
            </td>
            <td>
              <textarea id="notes-${doc.id}">${data.notes || ''}</textarea>
            </td>
            <td>
              <button onclick="saveEnquiry('${doc.id}')">Save</button>
            </td>
          </tr>
        `;
        table.innerHTML += row;
      });
    });

  function saveEnquiry(id){
    const status = document.getElementById("status-"+id).value;
    const notes = document.getElementById("notes-"+id).value;

    db.collection("enquiries").doc(id).update({
      status: status,
      notes: notes
    }).then(()=>{
      alert("Saved");
    });
  }
</script>

</body>
</html>
